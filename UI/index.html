<!doctype html>
<!--
  Vite entry document for the NUI SPA.

  Loaded by the CEF browser the FiveM client embeds, not by a web server -
  which is why there is no favicon, no meta description and no SEO markup:
  nothing crawls or bookmarks this page.

  The body stays transparent (see Style.css) so the game renders through
  wherever the SPA paints nothing; #App is the single mount point.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roleplay</title>
  </head>
  <body>
    <div id="App"></div>
    <script type="module" src="/Src/Main.ts"></script>
  </body>
</html>
