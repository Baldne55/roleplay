<!doctype html>
<!--
  Loading screen, shown by the FiveM client while it streams game data.

  Declared as the resource's `loadscreen` in fxmanifest, so it is the
  first thing a connecting player sees - before the auth skybox and long
  before the SPA exists. Entirely self-contained: no build step, no
  framework, and no network access, since it runs before the player has
  finished connecting.

  Script.js consumes FXServer's progress telemetry; see its header for the
  event contract and why the listener is on `message` rather than the
  named events the docs describe.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <link rel="stylesheet" href="./Style.css" />
  </head>
  <body>
    <!--
      Loading screen. Full-bleed background image with the brand logo
      centered on top. We render our own progress indicator in the bottom
      center; the Script.js handler also consumes FXServer's loadProgress
      stream which suppresses the default bottom-right "Loading game (NN%)"
      overlay (FXServer falls back to its own text only when the page
      ignores the event).
    -->
    <main class="Stage" aria-hidden="true">
      <img src="./Assets/Logo.png" alt="" class="Logo" />
    </main>
    <footer class="Progress" aria-hidden="true">
      <div class="ProgressBar">
        <div class="ProgressFill" id="ProgressFill"></div>
      </div>
      <div class="ProgressMeta">
        <span class="ProgressLabel" id="ProgressLabel">Loading</span>
        <span class="ProgressPercent" id="ProgressPercent">0%</span>
      </div>
    </footer>
    <script src="./Script.js"></script>
  </body>
</html>
